<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — Vegetable</title>
<meta name="description" content="Sign in to your Vegetable B2B marketplace account.">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<nav class="navbar">
  <div class="nav-brand" onclick="location.href='/'" style="cursor:pointer;">🌿 Vegetable</div>
  <button class="nav-toggle" aria-label="Toggle navigation" onclick="toggleMobileNav()">☰</button>
  <div class="nav-links">
    <a href="/">Home</a>
    <a href="https://wa.me/919879893957?text=Hello%20Vegetable%20Mandi,%20I%20want%20to%20order%20bulk%20produce." target="_blank" class="header-helpline">📞 Helpline: +91 98798 93957</a>
    <a href="/login.html" class="active">Login</a>
    <a href="/register.html">Register</a>
  </div>
</nav>

<div class="auth-container">
  <div class="auth-card animate-in">
    <div class="auth-logo">🌿 Vegetable</div>
    <h1>Welcome Back</h1>
    <p>Sign in to access your dashboard</p>

    <div id="loginError" class="error-msg" style="display:none"></div>

    <form onsubmit="handleLogin(event)" id="loginForm">
      <label for="email">Email Address</label>
      <input type="email" id="email" placeholder="you@business.com" required autocomplete="email">

      <label for="password">Password</label>
      <div style="position:relative;">
        <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password" style="padding-right:3rem;">
        <button type="button" onclick="togglePw()" id="pwToggle"
          style="position:absolute;right:0.75rem;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--ink-muted);font-size:1.1rem;padding:0">
          👁
        </button>
      </div>

      <button type="submit" id="loginBtn" class="btn-primary" style="width:100%;margin-top:1.5rem;padding:0.85rem;font-size:1rem;">
        Sign In →
      </button>
    </form>

    <p class="auth-footer" style="margin-top:1.5rem;">
      No account? <a href="/register.html">Create one free →</a>
    </p>
  </div>
</div>

<script src="/js/app.js"></script>
<script>
function togglePw() {
  const pw = document.getElementById('password');
  const btn = document.getElementById('pwToggle');
  if (pw.type === 'password') { pw.type = 'text'; btn.textContent = '🙈'; }
  else { pw.type = 'password'; btn.textContent = '👁'; }
}

// Check for checkout redirect notice
const params = new URLSearchParams(window.location.search);
if (params.get('redirect') === 'checkout') {
  const errEl = document.getElementById('loginError');
  if (errEl) {
    errEl.style.display = 'block';
    errEl.style.background = 'rgba(59, 130, 246, 0.12)';
    errEl.style.color = '#2563eb';
    errEl.style.borderColor = 'rgba(59, 130, 246, 0.3)';
    errEl.textContent = '🔑 Please sign in or register to complete your order checkout.';
  }
}

function handleLogin(e) {
  e.preventDefault();
  const btn = document.getElementById('loginBtn');
  const errEl = document.getElementById('loginError');
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;

  errEl.style.display = 'none';
  btn.textContent = 'Signing in…';
  btn.disabled = true;

  fetch('/api/auth/login', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ email, password })
  })
  .then(async r => {
    // Safely parse — server might be starting up or temporarily unavailable
    const text = await r.text();
    let data;
    try {
      data = JSON.parse(text);
    } catch {
      // Got HTML back (server down / deploying / 502 gateway)
      throw new Error('⚠️ Server is starting up or temporarily unavailable. Please wait 30 seconds and try again.');
    }
    if (!r.ok) throw new Error(data.error || 'Login failed');
    localStorage.setItem('token', data.token);
    localStorage.setItem('user', JSON.stringify(data.user));

    if (params.get('redirect') === 'checkout' && data.user.role === 'customer') {
      location.href = '/customer.html?section=cart';
    } else if (data.user.role === 'customer') {
      location.href = '/customer.html';
    } else if (data.user.role === 'retailer') {
      location.href = '/retailer.html';
    } else {
      location.href = '/admin.html';
    }
  })
  .catch(err => {
    errEl.style.background = '';
    errEl.style.color = '';
    errEl.style.borderColor = '';
    errEl.textContent = err.message;
    errEl.style.display = 'block';
    btn.textContent = 'Sign In →';
    btn.disabled = false;
  });
}
</script>
